[toolchain]
channel = "stable"

[features]
skip-lint = false

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "1.18.0"

[dev-dependencies]
anchor-runner = "0.29.0"

[build]
b = "bpf"
bpf_out_dir = "dist/programs"

[provider]
cluster = "devnet"
url = "https://api.devnet.solana.com"
wallet = "~/.config/solana/id.json"

[scripts]
test = "anchor test --skip-deploy"
